name: Deploy Visual Forge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Pages enablement
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$status" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages is enabled.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=GitHub Pages ready::Enable Pages once in Settings → Pages → Build and deployment → GitHub Actions. This workflow will deploy automatically on the next run.'
          fi

      - name: Configure Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Stage site
        if: steps.pages_state.outputs.enabled == 'true'
        run: |
          mkdir _site
          cp index.html .nojekyll _site/

      - name: Upload site
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        if: steps.pages_state.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
